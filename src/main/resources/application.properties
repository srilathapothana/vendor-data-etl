# Input file for the ETL job
etl.input=classpath:data/prices.csv

# In-memory H2 database (swap for MySQL/Oracle by changing these properties)
spring.datasource.url=jdbc:h2:mem:etl;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Job runs automatically on startup; schema.sql creates the target table
spring.batch.job.enabled=true
